<?xml version="1.0" encoding="UTF-8"?>
<!--
  The HTCondor brand mark, taken verbatim from the HTCondor source tree
  (docs/_static/logo.svg), with the same square canvas the web UI's own
  icon uses (webapi/frontend/src/app/icon.svg) so the two agree.

  The one change is the colour. The mark is #ce1f44 red; an activity bar
  icon has to be currentColor, because VS Code renders it in the theme's
  foreground and dims it when the view is not active. A red icon ignores
  that: it stays red in every theme, looks wrong in half of them, and
  cannot be fixed by the user. The gallery icon, where colour belongs,
  keeps the red.

  The mark is 1868.15 x 680.73, roughly 2.7:1, and this canvas is
  square, so it sits centred and inset: the largest it can be drawn in
  a square without distorting it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1868.15 1868.15">
  <g transform="translate(93.41,627.72) scale(0.9)">
    <path fill="currentColor" d="M1762.09,22.26c-222.47,63.32-556.11,141.43-812.66,353.05C684.32,143.17,258.3,42.53,157.65,22.01,68.27,3.75-76.7-17.67,49.23,27.93c307,97.93,796.3,510.02,880.91,639.94,11.1,17.06,22,17.06,35.19,.53,101.72-127.78,371.18-367.11,868-641.67,53.12-27.55,57.03-41.03-71.25-4.48Z"/>
  </g>
</svg>
